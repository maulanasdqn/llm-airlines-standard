      <text x="419" y="237" text-anchor="middle" fill="#0B1F3A">W rules for prose</text>
      <rect x="522" y="212" width="170" height="38" rx="19" fill="#7FB2FF"/>
      <text x="607" y="237" text-anchor="middle" fill="#0B1F3A">C rules for code</text>
      <rect x="706" y="212" width="150" height="38" rx="19" fill="none" stroke="#B8C7DC" stroke-width="2"/>
      <text x="781" y="237" text-anchor="middle" fill="#FFFFFF">4 Agent Skills</text>
      <rect x="870" y="212" width="214" height="38" rx="19" fill="none" stroke="#B8C7DC" stroke-width="2"/>
      <text x="977" y="237" text-anchor="middle" fill="#FFFFFF">6 AGENTS.md templates</text>
    </g>
