name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked --quiet -- build --check
      - run: cargo run --locked --quiet -- check prose .
      - run: cargo run --locked --quiet -- check code .

  linters:
    runs-on: ubuntu-latest
    env:
      VALE_VERSION: "3.29.0"
      GOLANGCI_LINT_VERSION: "2.15.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Vale and golangci-lint
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar -xz -C "$HOME/.local/bin" vale
          curl -sSfL "https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}/golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz" | tar -xz --strip-components=1 -C "$HOME/.local/bin" "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash tools/verify_linters.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package the binary as a release
        shell: pwsh
        run: |
          $release = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force $release | Out-Null
          $archive = Join-Path $release 'ste-x86_64-pc-windows-msvc.zip'
          Compress-Archive -Path target/release/ste.exe -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  ste-x86_64-pc-windows-msvc.zip" | Out-File -Encoding ascii "$archive.sha256"
      - name: Install with install.ps1
        shell: pwsh
        run: |
          $env:STE_DOWNLOAD_URL = Join-Path $env:RUNNER_TEMP 'release'
          $env:STE_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'bin'
          ./install.ps1 -BinaryOnly -AddToPath
          $ste = Join-Path $env:STE_INSTALL_DIR 'ste.exe'
          & $ste --version
          if ($LASTEXITCODE -ne 0) { throw 'The installed ste.exe did not start.' }
          $skills = Join-Path $env:RUNNER_TEMP 'skills'
          & $ste install --skills ste-writing --dir $skills
          if (-not (Test-Path (Join-Path $skills 'ste-writing/SKILL.md'))) { throw 'ste install did not write the ste-writing skill.' }
          & $ste check prose README.md
          if ($LASTEXITCODE -ne 0) { throw 'ste check prose found errors in README.md on Windows.' }
